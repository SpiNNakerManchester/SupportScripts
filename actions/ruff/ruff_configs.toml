line-length = 79

[lint]
# see https://docs.astral.sh/ruff/rules/
ignore = [
    # PYlint Error
    "PLE1205", # https://docs.astral.sh/ruff/rules/logging-too-many-args/
    # https://github.com/astral-sh/ruff/issues/16715

    # flake8-simplify
    "SIM102", # https://docs.astral.sh/ruff/rules/collapsible-if/
    # when multiple lines are needed it is not easier to read!
    ]

[lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "spinn_utilities",
    "spinn_machine",
    "spinnman",
    "pacman",
    "pacman_test_objects",
    "spalloc_client",
    "spinn_front_end_common",
    "spinnaker_testbase",
    "spynnaker",
    "spinnaker_graph_front_end",
    "python_models",
    "spinn_gym",
    "mcmc",
    "spinnirker",
    "first-party",
    "local-folder"]
known-first-party = ["gfe_integration_tests",
    "unittests"]

[lint.isort.sections]
    "spinn_utilities" = ["spinn_utilities"]
    "spinn_machine" = ["spinn_machine"]
    "spinnman" = ["spinnman"]
    "pacman" = ["pacman"]
    "pacman_test_objects" = ["pacman_test_objects"]
    "spalloc_client" = ["spalloc_client"]
    "spinn_front_end_common" = ["spinn_front_end_common"]
    "spinnaker_testbase" = ["spinnaker_testbase"]
    "spynnaker" = ["spynnaker"]
    "spinnaker_graph_front_end" = ["spinnaker_graph_front_end"]
    "python_models" = ["python_models"]
    "spinn_gym" = ["spinn_gym"]
    "mcmc" = ["mcmc"]
    "spinnirker" = ["spinnirker"]