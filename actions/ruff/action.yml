name: "Lint with ruff"

description: >
  Runs the ruff check
inputs:
  package:
    description: The name of the Python package (or packages) to analyse
    required: true

runs:
  using: composite
  steps:
  - run: |
      echo run ruff with current version
      if [[ ${{ matrix.python-version}} = 3.10 ]]; then
        echo ruff check ${{ inputs.package }} --target-version py310 --config ${{ github.action_path }}/ruff.toml
        ruff check ${{ inputs.package }} --target-version py310  --config ${{ github.action_path }}/ruff.toml
        echo ruff check ${{ inputs.package }} --target-version py310 --config ${{ github.action_path }}/ruff_up.toml
        ruff check ${{ inputs.package }} --target-version py310  --config ${{ github.action_path }}/ruff_up.toml
      elif [[ ${{ matrix.python-version}} = 3.11 ]]; then
        echo ruff check ${{ inputs.package }} --target-version py311 --config ${{ github.action_path }}/ruff.toml
        ruff check ${{ inputs.package }} --target-version py311 --config ${{ github.action_path }}/ruff.toml
      elif [[ ${{ matrix.python-version}} = 3.12 ]]; then
        echo ruff check ${{ inputs.package }} --target-version py312 --config ${{ github.action_path }}/ruff.toml
        ruff check ${{ inputs.package }} --target-version py312 --config ${{ github.action_path }}/ruff.toml
      elif [[ ${{ matrix.python-version}} = 3.13 ]]; then
        echo ruff check ${{ inputs.package }} --target-version py313 --config ${{ github.action_path }}/ruff.toml
        ruff check ${{ inputs.package }} --target-version py313 --config ${{ github.action_path }}/ruff.toml
      elif [[ ${{ matrix.python-version}} = 3.14 ]]; then
        echo ruff check ${{ inputs.package }} --target-version py314 --config ${{ github.action_path }}/ruff.toml
        ruff check ${{ inputs.package }} --target-version py314 --config ${{ github.action_path }}/ruff.toml
      elif [[ ${{ matrix.python-version}} = 3.15 ]]; then
        echo ruff check ${{ inputs.package }} --target-version py315 --config ${{ github.action_path }}/ruff.toml
        ruff check ${{ inputs.package }} --target-version py315 --config ${{ github.action_path }}/ruff.toml
      elif [[ ${{ matrix.python-version}} = 3.16 ]]; then
        echo ruff check ${{ inputs.package }} --target-version py316 --config ${{ github.action_path }}/ruff.toml
        ruff check ${{ inputs.package }} --target-version py316 --config ${{ github.action_path }}/ruff.toml
      elif [[ ${{ matrix.python-version}} = 3.17 ]]; then
        echo ruff check ${{ inputs.package }} --target-version py317 --config ${{ github.action_path }}/ruff.toml
        ruff check ${{ inputs.package }} --target-version py317 --config ${{ github.action_path }}/ruff.toml
      elif [[ ${{ matrix.python-version}} = 3.18 ]]; then
        echo ruff check ${{ inputs.package }} --target-version py318 --config ${{ github.action_path }}/ruff.toml
        ruff check ${{ inputs.package }} --target-version py318 --config ${{ github.action_path }}/ruff.toml
      else
        echo unexpected pythn versiion ${{ matrix.python-version}}
        runn check --target-version ${{ matrix.python-version}}
      fi
    shell: bash
  
